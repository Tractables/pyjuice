name: Build the documentation

on:
  workflow_dispatch:

  # `main` only. Without a branch filter this ran on every push to every branch, and the publish step
  # below force-pushes `gh-pages` with `CLEAN: true` -- so the public site was being rebuilt from
  # whatever feature branch was last pushed, documenting APIs that are not on `main`.
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install sphinx sphinx_rtd_theme myst_parser sphinx-gallery

      - name: Install PyJuice
        run: |
          pip install -e .

      - name: Build the documentation with Sphinx
        run: |
          sphinx-build -b html docs/source docs/build/html

      # Pull requests build the docs but do NOT publish them: the build is worth having as a check
      # (it catches Sphinx errors before merge), while publishing from a PR would put an unmerged
      # branch's documentation on the live site.
      - name: Publish the documentation
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@3.6.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs/build/html
          CLEAN: true